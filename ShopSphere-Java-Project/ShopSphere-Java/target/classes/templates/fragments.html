<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark shop-nav sticky-top">
 <div class="container">
  <a class="navbar-brand fw-bold" href="/"><span class="brand-mark">S</span> ShopSphere</a>
  <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#mainNav"><span class="navbar-toggler-icon"></span></button>
  <div id="mainNav" class="collapse navbar-collapse">
   <form class="d-flex mx-lg-auto my-3 my-lg-0 search-form" action="/" method="get">
    <input class="form-control" name="q" th:value="${q}" placeholder="Search products, categories...">
    <button class="btn btn-warning" type="submit"><i class="bi bi-search"></i></button>
   </form>
   <div class="d-flex gap-3 align-items-center"><a class="nav-link text-white" href="/">Explore</a><a class="nav-link text-white cart-link" href="/cart"><i class="bi bi-bag"></i> Cart <span class="cart-badge" th:text="${cartCount}">0</span></a></div>
  </div>
 </div>
</nav>
<footer th:fragment="footer" class="footer mt-5"><div class="container py-4 d-flex flex-column flex-md-row justify-content-between gap-2"><div><div class="fw-bold text-white">ShopSphere</div><small>Thoughtful finds. Everyday value.</small></div><small>Java · Spring Boot · MySQL · Thymeleaf | Portfolio demo</small></div></footer>
</body></html>
