<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{common :: head('Checkout | ShopSphere')}"></head><body>
<div th:replace="~{fragments :: nav}"></div><main class="container py-5"><a href="/cart" class="back-link"><i class="bi bi-arrow-left"></i> Back to cart</a><div class="row g-5 mt-1"><div class="col-lg-7"><span class="eyebrow">ALMOST YOURS</span><h1 class="page-title">Checkout</h1><p class="text-muted mb-4">Enter delivery details to place a demo order.</p><form action="/checkout" method="post" class="checkout-panel"><div class="mb-3"><label class="form-label" for="customerName">Full name</label><input class="form-control form-control-lg" id="customerName" name="customerName" required maxlength="120" placeholder="Your full name"></div><div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control form-control-lg" id="email" name="email" type="email" required placeholder="you@example.com"></div><div class="mb-4"><label class="form-label" for="address">Delivery address</label><textarea class="form-control" id="address" name="address" rows="3" required maxlength="1000" placeholder="Flat, street, area, city, PIN code"></textarea></div><button class="btn btn-dark btn-lg rounded-pill w-100" type="submit">Place demo order <i class="bi bi-arrow-right ms-2"></i></button><p class="secure-note text-center mt-3 mb-0"><i class="bi bi-info-circle"></i> Demo only — payment gateway is not connected.</p></form></div><div class="col-lg-5"><aside class="summary-panel"><h3>Order total</h3><div class="summary-row"><span>Items subtotal</span><b th:text="'₹' + ${#numbers.formatDecimal(total,1,'COMMA',2,'POINT')}">₹0</b></div><div class="summary-row"><span>Delivery</span><b class="text-success">FREE</b></div><hr><div class="summary-row total-row"><span>Total to pay</span><strong th:text="'₹' + ${#numbers.formatDecimal(total,1,'COMMA',2,'POINT')}">₹0</strong></div></aside></div></div></main>
<div th:replace="~{fragments :: footer}"></div><div th:replace="~{common :: scripts}"></div></body></html>
