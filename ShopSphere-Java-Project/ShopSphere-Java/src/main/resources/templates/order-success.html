<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{common :: head('Order placed | ShopSphere')}"></head><body>
<div th:replace="~{fragments :: nav}"></div><main class="container py-5"><section class="success-panel"><div class="success-icon"><i class="bi bi-check2"></i></div><span class="eyebrow">ORDER CONFIRMED</span><h1>Thanks for your order!</h1><p class="text-muted">Your demo order has been saved successfully.</p><div class="order-number">Order number <strong th:text="'#SS-' + ${order.id}">#SS-1</strong></div><div class="success-details"><div><small>Customer</small><b th:text="${order.customerName}">Name</b></div><div><small>Order total</small><b th:text="'₹' + ${#numbers.formatDecimal(order.total,1,'COMMA',2,'POINT')}">₹0</b></div><div><small>Status</small><b><span class="status-pill">PLACED</span></b></div></div><p class="small text-muted mt-3">This portfolio demo does not charge money or send real deliveries.</p><a href="/" class="btn btn-dark rounded-pill px-5 mt-3">Continue exploring</a></section></main>
<div th:replace="~{fragments :: footer}"></div><div th:replace="~{common :: scripts}"></div></body></html>
