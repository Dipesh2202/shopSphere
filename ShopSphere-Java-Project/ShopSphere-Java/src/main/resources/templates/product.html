<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{common :: head('Product details | ShopSphere')}"></head><body>
<div th:replace="~{fragments :: nav}"></div><main class="container py-5"><a href="/" class="back-link"><i class="bi bi-arrow-left"></i> Back to shopping</a>
<div class="row g-5 align-items-center mt-2"><div class="col-md-6"><div class="detail-image"><img th:src="${product.imageUrl} + '?auto=format&fit=crop&w=1000&q=85'" th:alt="${product.name}"></div></div><div class="col-md-6"><span class="eyebrow" th:text="${product.category}">CATEGORY</span><h1 class="detail-title" th:text="${product.name}">Product name</h1><div class="detail-rating"><i class="bi bi-star-fill"></i> 4.8 <span>· Demo product rating</span></div><div class="detail-price" th:text="'₹' + ${#numbers.formatDecimal(product.price,1,'COMMA',0,'POINT')}">₹2,499</div><p class="detail-description" th:text="${product.description}">Description</p><p class="stock-note"><i class="bi bi-check-circle-fill"></i> <span th:text="${product.stock} + ' available in demo stock'">Available</span></p><form th:action="@{/cart/add/{id}(id=${product.id})}" method="post"><button class="btn btn-dark btn-lg rounded-pill px-5 w-100" type="submit" th:disabled="${product.stock<=0}"><i class="bi bi-bag-plus me-2"></i> Add to cart</button></form><div class="detail-perks mt-4"><span><i class="bi bi-truck"></i> Delivery details at checkout</span><span><i class="bi bi-arrow-repeat"></i> Cart quantity is editable</span></div></div></div></main>
<div th:replace="~{fragments :: footer}"></div><div th:replace="~{common :: scripts}"></div></body></html>
